name: Nutrition upstream verification
on:
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reproduce snapshot from the pinned official release
        run: python3 nutrition/import_bls.py --download --check --check-upstream
      - name: Validate mappings and generate review queue
        run: python3 nutrition/check.py --report .cache/nutrition/review.json
