name: Recipe checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Unabhängige Jobs laufen parallel; ein Fehler stoppt die anderen nicht.
      fail-fast: false
      matrix:
        include:
          - name: Markdown formatting
            script: lint:markdown
          - name: Recipe metadata and database
            script: lint:recipes
          - name: Source archive integrity
            script: lint:sources
          - name: Regression tests
            script: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Markdown linter
        if: matrix.script == 'lint:markdown'
        run: npm ci --ignore-scripts
      - name: Run check
        run: npm run ${{ matrix.script }}
